compile:
  output-dir: ./build/compile-load-store

  compiler:
    install-dir: /llvm-build
    target: myisa
    misc:
      - -O1
      - --target=i386-unknown-none-elf
    codegen:
      - -O0
    add-path: []

  output:
    asm: true
    hex: true
    name: program
    assembler: ""

  startup:
    entry: memory_roundtrip
    args: [256, 4660]

  groups:
    - group: Tests
      files:
        - file: ./tests/test_load_store.c
