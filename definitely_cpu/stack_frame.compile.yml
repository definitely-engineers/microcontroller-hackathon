compile:
  output-dir: ./build/compile-stack-frame

  compiler:
    install-dir: /llvm-build
    target: myisa
    misc:
      - -O1
      - --target=i386-unknown-none-elf
    codegen:
      - -O0
    add-path: []

  output:
    asm: true
    hex: true
    name: program
    assembler: ""

  startup:
    entry: stack_roundtrip
    args: [21, 21]

  groups:
    - group: Tests
      files:
        - file: ./tests/test_stack_frame.c
