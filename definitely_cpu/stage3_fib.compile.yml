compile:
  output-dir: ./build/compile-stage3-fib
  compiler:
    install-dir: /llvm-build
    target: myisa
    misc: [-O0, --target=i386-unknown-none-elf]
    codegen: [-O0]
    add-path: []
  output: {asm: true, hex: true, name: program, assembler: ""}
  startup: {entry: stage3_fib, args: [7]}
  groups:
    - group: Tests
      files:
        - file: ./tests/test_stage3_fib.c
