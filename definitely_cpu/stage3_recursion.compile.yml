compile:
  output-dir: ./build/compile-stage3-recursion
  compiler:
    install-dir: /llvm-build
    target: myisa
    # Keep recursion as real CALL/RET code while allowing Clang to remove the
    # redundant -O0 return/argument allocas that otherwise alias badly during
    # the current backend's frame-index lowering.
    misc: [-O1, -fno-optimize-sibling-calls, --target=i386-unknown-none-elf]
    codegen: [-O1]
    add-path: []
  output: {asm: true, hex: true, name: program, assembler: ""}
  startup: {entry: stage3_recursive_sum, args: [6]}
  groups:
    - group: Tests
      files:
        - file: ./tests/test_stage3_recursion.c
