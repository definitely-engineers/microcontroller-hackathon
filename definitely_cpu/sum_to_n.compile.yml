compile:
  output-dir: ./build/compile-sum-to-n

  compiler:
    install-dir: /llvm-build
    target: myisa
    misc:
      - -O0
      - --target=i386-unknown-none-elf
    codegen:
      - -O0
    add-path: []

  output:
    asm: true
    hex: true
    name: program
    assembler: ""

  startup:
    entry: sum_to_n
    args: [10]

  groups:
    - group: Tests
      files:
        - file: ./tests/test_sum_to_n.c
